{% if snap_url %}
  <img src="{{ snap_url }}" alt="Latest snapshot"
       class="w-full h-full object-cover rounded-lg" />
{% else %}
  <div class="w-full h-full flex items-center justify-center rounded-lg bg-gray-800">
    <div class="text-center text-gray-500">
      <svg class="w-12 h-12 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M4 6h9a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z"/>
      </svg>
      <p class="text-sm">No snapshot yet</p>
    </div>
  </div>
{% endif %}
